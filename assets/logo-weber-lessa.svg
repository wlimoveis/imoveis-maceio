<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Gradiente dourado escuro -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C88700"/>
      <stop offset="50%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Gradiente metálico -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD66A"/>
      <stop offset="30%" style="stop-color:#F2B21A"/>
      <stop offset="60%" style="stop-color:#C88700"/>
      <stop offset="100%" style="stop-color:#6B4200"/>
    </linearGradient>
    
    <!-- Sombra para profundidade -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6B4200" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- ==================== ANEL EXTERNO ==================== -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#6B4200" stroke-width="0.5" opacity="0.5"/>
  
  <!-- ==================== ANEL CENTRAL (BRANCO) ==================== -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  
  <!-- ==================== ANEL INTERNO ==================== -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  
  <!-- ==================== MONOGRAMA WL ==================== -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <!-- W com sobreposição à L -->
    <text x="0" y="0" font-family="'Times New Roman', Georgia, serif" font-size="52" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" letter-spacing="0" dominant-baseline="central">
      W
    </text>
    <text x="12" y="0" font-family="'Times New Roman', Georgia, serif" font-size="52" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" letter-spacing="0" dominant-baseline="central">
      L
    </text>
  </g>
  
  <!-- ==================== ELEMENTO DOURADO "V" ==================== -->
  <path d="M 85 110 L 100 95 L 115 110" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- ==================== TRAÇO DIVISÓRIO ARQUEADO ==================== -->
  <path d="M 70 125 Q 100 118 130 125" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- ==================== TEXTO "IMÓVEIS" ==================== -->
  <text x="100" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" 
        fill="#F2B21A" text-anchor="middle" letter-spacing="4" dominant-baseline="central"
        stroke="#C88700" stroke-width="0.3">
    IMÓVEIS
  </text>
</svg>
