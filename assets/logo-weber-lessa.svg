<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Importar a fonte Cinzel do Google Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
      
      .fonte-cinzel {
        font-family: 'Cinzel', 'Times New Roman', Georgia, serif;
      }
      
      .fonte-imoveis {
        font-family: 'Cinzel', 'Arial', sans-serif;
      }
    </style>
    
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Gradiente dourado escuro -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C88700"/>
      <stop offset="40%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#A06700"/>
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#6B4200" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- ==================== CÍRCULOS ==================== -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  
  <!-- ==================== MONOGRAMA WL ==================== -->
  <g filter="url(#shadow)">
    
    <!-- ========== LETRA W - BRANCA ========== -->
    <text x="66" y="98" class="fonte-cinzel" font-size="88" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">W</text>
    
    <!-- ========== PERNAS DO W ========== -->
    <path d="M 45 73 L 55 73 L 55 78 L 45 78 Z" fill="#FFFFFF"/>
    <path d="M 50 78 L 55 98 L 50 98 L 45 78 Z" fill="#FFFFFF"/>
    <path d="M 50 98 L 50 128 L 45 128 L 45 98 Z" fill="#FFFFFF"/>
    
    <path d="M 78 98 L 85 128 L 80 128 L 73 98 Z" fill="url(#goldDark)" opacity="0.9"/>
    
    <path d="M 58 73 L 71 73 L 71 78 L 58 78 Z" fill="url(#goldGrad)" stroke="#C88700" stroke-width="0.5"/>
    <path d="M 66 78 L 71 98 L 66 98 L 61 78 Z" fill="url(#goldGrad)" stroke="#C88700" stroke-width="0.5"/>
    <path d="M 66 98 L 66 128 L 61 128 L 61 98 Z" fill="url(#goldGrad)" stroke="#C88700" stroke-width="0.5"/>
    
    <path d="M 60 128 L 66 98 L 61 98 L 55 128 Z" fill="url(#goldDark)" opacity="0.9"/>
    
    <!-- ========== LETRA L - BRANCA ========== -->
    <text x="138" y="98" class="fonte-cinzel" font-size="88" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">L</text>
    
    <!-- ========== PÉ DO L ========== -->
    <path d="M 118 128 L 154 128 L 154 123 L 118 123 Z" fill="url(#goldDark)" opacity="0.9"/>
    
  </g>
  
  <!-- ==================== TRAÇO DIVISÓRIO ==================== -->
  <path d="M 62 142 Q 100 134 138 142" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- ==================== TEXTO "IMÓVEIS" (COM FONTE CINZEL) ==================== -->
  <text x="100" y="163" class="fonte-imoveis" font-size="22" font-weight="bold" 
        fill="#F2B21A" text-anchor="middle" letter-spacing="2" dominant-baseline="central"
        stroke="#C88700" stroke-width="0.3">
    IMÓVEIS
  </text>
</svg>
