<svg xmlns="http://www.w3.org/2000/svg" 
     width="70" height="70" 
     viewBox="0 0 70 70"
     preserveAspectRatio="xMidYMid meet">
  
  <defs>
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Gradiente dourado escuro -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C88700"/>
      <stop offset="50%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Sombra -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#6B4200" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- ========================================== -->
  <!-- ANEL EXTERNO                               -->
  <!-- ========================================== -->
  <circle cx="35" cy="35" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="35" cy="35" r="33.5" fill="none" stroke="#6B4200" stroke-width="0.2" opacity="0.4"/>
  
  <!-- ========================================== -->
  <!-- ANEL CENTRAL (BRANCO)                      -->
  <!-- ========================================== -->
  <circle cx="35" cy="35" r="31.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  
  <!-- ========================================== -->
  <!-- ANEL INTERNO                               -->
  <!-- ========================================== -->
  <circle cx="35" cy="35" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="35" cy="35" r="29.5" fill="none" stroke="#6B4200" stroke-width="0.2" opacity="0.4"/>
  
  <!-- ========================================== -->
  <!-- ELEMENTO DOURADO "V" (Ajustado para esquerda) -->
  <!-- ========================================== -->
  <path d="M 25 31 L 33 35.5 L 41 31" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
  
  <!-- ========================================== -->
  <!-- MONOGRAMA WL (MAIOR e DESLOCADO para ESQUERDA) -->
  <!-- ========================================== -->
  <g filter="url(#shadow)">
    <!-- Letra W - Aumentada para 42px e deslocada para esquerda -->
    <text x="20" y="32.5" font-family="'Times New Roman', Georgia, serif" 
          font-size="42" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">W</text>
    
    <!-- Letra L - Aumentada para 42px e deslocada para esquerda -->
    <text x="48" y="32.5" font-family="'Times New Roman', Georgia, serif" 
          font-size="42" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">L</text>
  </g>
  
  <!-- ========================================== -->
  <!-- TRAÇO DIVISÓRIO ARQUEADO (Ajustado)        -->
  <!-- ========================================== -->
  <path d="M 21 45.5 Q 35 43.5 49 45.5" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- ========================================== -->
  <!-- TEXTO IMÓVEIS                              -->
  <!-- ========================================== -->
  <text x="35" y="52" font-family="Arial, Helvetica, sans-serif" 
        font-size="9.5" font-weight="bold" fill="#F2B21A" 
        text-anchor="middle" letter-spacing="1.2" dominant-baseline="central"
        stroke="#C88700" stroke-width="0.15">
    IMÓVEIS
  </text>
  
</svg>
