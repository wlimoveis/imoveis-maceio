<svg xmlns="http://www.w3.org/2000/svg" 
     width="40" height="40" 
     viewBox="0 0 40 40"
     preserveAspectRatio="xMidYMid meet">
  
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-color="#6B4200" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Anéis -->
  <circle cx="20" cy="20" r="19.4" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <circle cx="20" cy="20" r="18" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="20" cy="20" r="17" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  
  <!-- Monograma -->
  <g filter="url(#shadow)">
    <text x="13" y="20" font-family="'Times New Roman', Georgia, serif" 
          font-size="18" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">W</text>
    <text x="27" y="20" font-family="'Times New Roman', Georgia, serif" 
          font-size="18" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">L</text>
  </g>
  
  <!-- Traço -->
  <path d="M 12 28 Q 20 26 28 28" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  
  <!-- Texto -->
  <text x="20" y="32.5" font-family="Arial, Helvetica, sans-serif" 
        font-size="5" font-weight="bold" fill="#F2B21A" 
        text-anchor="middle" letter-spacing="0.5" dominant-baseline="central">
    IMÓVEIS
  </text>
</svg>
