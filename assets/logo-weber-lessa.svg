<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Sombra suave para profundidade -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#6B4200" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- ==================== ANEL EXTERNO (DOURADO) ==================== -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  
  <!-- ==================== ANEL CENTRAL (BRANCO) - ESPESSURA MÍNIMA ==================== -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- ==================== ANEL INTERNO (DOURADO) ==================== -->
  <circle cx="100" cy="100" r="89" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  
  <!-- ==================== MONOGRAMA WL - COM ESPAÇAMENTO ==================== -->
  <g filter="url(#shadow)">
    <!-- Letra W - Branca -->
    <text x="78" y="98" font-family="'Times New Roman', Georgia, serif" font-size="88" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">W</text>
    
    <!-- Segunda perna do W (dourada) -->
    <path d="M 93 98 L 100 128" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Quarta perna do W (dourada) - ajustada para não tocar o L -->
    <path d="M 78 128 L 64 98" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Letra L - Branca (com espaçamento à direita do W) -->
    <text x="122" y="98" font-family="'Times New Roman', Georgia, serif" font-size="88" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">L</text>
    
    <!-- Pé do L (dourado) -->
    <path d="M 108 128 L 136 128" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- ==================== TRAÇO DIVISÓRIO ARQUEADO ==================== -->
  <path d="M 62 142 Q 100 134 138 142" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- ==================== TEXTO "IMÓVEIS" ==================== -->
  <text x="100" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" 
        fill="#F2B21A" text-anchor="middle" letter-spacing="6" dominant-baseline="central"
        stroke="#C88700" stroke-width="0.3">
    IMÓVEIS
  </text>
</svg>
