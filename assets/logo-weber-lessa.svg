<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN"
 "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
 width="200" height="200" viewBox="0 0 200 200"
 preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Gradiente dourado escuro -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C88700"/>
      <stop offset="40%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#A06700"/>
    </linearGradient>
    
    <!-- Sombra para profundidade -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#6B4200" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- ========================================== -->
  <!-- ANEL EXTERNO - Dourado metálico            -->
  <!-- ========================================== -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="95.5" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  
  <!-- ========================================== -->
  <!-- ANEL CENTRAL - Branco                      -->
  <!-- ========================================== -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  
  <!-- ========================================== -->
  <!-- ANEL INTERNO - Dourado metálico            -->
  <!-- ========================================== -->
  <circle cx="100" cy="100" r="87" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="85.5" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  
  <!-- ========================================== -->
  <!-- ELEMENTO DOURADO "V" (do EPS)              -->
  <!-- ========================================== -->
  <path d="M 82 95 L 100 108 L 118 95" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- ========================================== -->
  <!-- MONOGRAMA WL - Versão do EPS               -->
  <!-- ========================================== -->
  <g filter="url(#shadow)">
    
    <!-- LETRA W - Branca -->
    <text x="66" y="98" font-family="'Times New Roman', Georgia, serif" 
          font-size="88" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">W</text>
    
    <!-- PERNA 1 - Branca -->
    <path d="M 45 73 L 55 73 L 55 78 L 45 78 Z" fill="#FFFFFF"/>
    <path d="M 50 78 L 55 98 L 50 98 L 45 78 Z" fill="#FFFFFF"/>
    <path d="M 50 98 L 50 128 L 45 128 L 45 98 Z" fill="#FFFFFF"/>
    
    <!-- PERNA 2 - Dourada -->
    <path d="M 78 98 L 85 128 L 80 128 L 73 98 Z" fill="url(#goldDark)" opacity="0.9"/>
    
    <!-- PERNA 3 - Dourada (sobreposta) -->
    <path d="M 58 73 L 71 73 L 71 78 L 58 78 Z" fill="url(#goldGrad)" stroke="#C88700" stroke-width="0.5"/>
    <path d="M 66 78 L 71 98 L 66 98 L 61 78 Z" fill="url(#goldGrad)" stroke="#C88700" stroke-width="0.5"/>
    <path d="M 66 98 L 66 128 L 61 128 L 61 98 Z" fill="url(#goldGrad)" stroke="#C88700" stroke-width="0.5"/>
    
    <!-- PERNA 4 - Dourada -->
    <path d="M 60 128 L 66 98 L 61 98 L 55 128 Z" fill="url(#goldDark)" opacity="0.9"/>
    
    <!-- LETRA L - Branca -->
    <text x="138" y="98" font-family="'Times New Roman', Georgia, serif" 
          font-size="88" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">L</text>
    
    <!-- PÉ DO L - Dourado -->
    <path d="M 118 128 L 154 128 L 154 123 L 118 123 Z" fill="url(#goldDark)" opacity="0.9"/>
    
  </g>
  
  <!-- ========================================== -->
  <!-- TRAÇO DIVISÓRIO ARQUEADO                   -->
  <!-- ========================================== -->
  <path d="M 60 142 Q 100 133 140 142" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- ========================================== -->
  <!-- TEXTO "IMÓVEIS"                            -->
  <!-- ========================================== -->
  <text x="100" y="163" font-family="Arial, Helvetica, sans-serif" 
        font-size="22" font-weight="bold" fill="#F2B21A" 
        text-anchor="middle" letter-spacing="2" dominant-baseline="central"
        stroke="#C88700" stroke-width="0.3">
    IMÓVEIS
  </text>
  
</svg>
