<svg xmlns="http://www.w3.org/2000/svg" 
     width="70" height="70" 
     viewBox="0 0 70 70"
     preserveAspectRatio="xMidYMid meet">
  
  <defs>
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Gradiente dourado escuro -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C88700"/>
      <stop offset="50%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Sombra -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#6B4200" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- ANEL EXTERNO -->
  <circle cx="35" cy="35" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="35" cy="35" r="33.5" fill="none" stroke="#6B4200" stroke-width="0.2" opacity="0.4"/>
  
  <!-- ANEL CENTRAL -->
  <circle cx="35" cy="35" r="31.5" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  
  <!-- ANEL INTERNO -->
  <circle cx="35" cy="35" r="30" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="35" cy="35" r="29.5" fill="none" stroke="#6B4200" stroke-width="0.2" opacity="0.4"/>
  
  <!-- ELEMENTO "V" -->
  <path d="M 16 49 Q 35 47 49 49" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
  
  <!-- MONOGRAMA WL -->
  <g filter="url(#shadow)">
    <!-- Letra W -->
    <text x="23" y="35" font-family="'Times New Roman', Georgia, serif" 
          font-size="30" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">W</text>
    
    <!-- Letra L -->
    <text x="47" y="35" font-family="'Times New Roman', Georgia, serif" 
          font-size="30" font-weight="bold" fill="#FFFFFF" 
          text-anchor="middle" dominant-baseline="central">L</text>
  </g>
  
  <!-- TRAÇO ARQUEADO -->
  <path d="M 25 49 Q 15 47 45 45" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- TEXTO IMÓVEIS -->
  <text x="35" y="53" font-family="Arial, Helvetica, sans-serif" 
        font-size="9.5" font-weight="bold" fill="#F2B21A" 
        text-anchor="middle" letter-spacing="1" dominant-baseline="central"
        stroke="#C88700" stroke-width="0.15">
    IMÓVEIS
  </text>
  
</svg>
