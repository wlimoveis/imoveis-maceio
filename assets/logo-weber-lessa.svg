<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradiente dourado principal -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B21A"/>
      <stop offset="40%" style="stop-color:#FFD66A"/>
      <stop offset="70%" style="stop-color:#F2B21A"/>
      <stop offset="100%" style="stop-color:#C88700"/>
    </linearGradient>
    
    <!-- Sombra suave para profundidade -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#6B4200" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- ==================== CÍRCULOS ==================== -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#6B4200" stroke-width="0.3" opacity="0.4"/>
  
  <!-- ==================== MONOGRAMA WL ==================== -->
  <g filter="url(#shadow)">
    
    <!-- ========== LETRA W - BRANCA (FUNDO) ========== -->
    <text x="66" y="98" font-family="'Times New Roman', Georgia, serif" font-size="88" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">W</text>
    
    <!-- ========== SEGUNDA PERNA DO W (DOURADA - BASE) ========== -->
    <!-- Inclinação: da esquerda para o centro (\/) -->
    <path d="M 78 98 
             L 85 128 
             L 80 128 
             L 73 98 
             Z" 
          fill="url(#goldGrad)" opacity="0.8"/>
    
    <!-- ========== TERCEIRA PERNA DO W (DOURADA - CÓPIA FIEL DA PRIMEIRA) ========== -->
    <!-- 
      Esta perna é uma CÓPIA FIEL DA PRIMEIRA PERNA, incluindo:
      - Corpo (parte vertical)
      - Pescoço (parte inclinada)
      - Cabeça (topo que se conecta ao "W")
      
      A primeira perna do "W" original tem este formato:
      - Começa no topo do "W" (y≈75)
      - Desce inclinada até o meio (y≈98)
      - Desce reta até a base (y≈128)
    -->
    <path d="M 66 75
             L 72 98
             L 72 128
             L 67 128
             L 67 98
             L 61 75
             Z" 
          fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- ========== QUARTA PERNA DO W (DOURADA - BASE) ========== -->
    <path d="M 60 128 
             L 66 98 
             L 61 98 
             L 55 128 
             Z" 
          fill="url(#goldGrad)" opacity="0.8"/>
    
    <!-- ========== LETRA L - BRANCA ========== -->
    <text x="138" y="98" font-family="'Times New Roman', Georgia, serif" font-size="88" font-weight="bold" 
          fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">L</text>
    
    <!-- ========== PÉ DO L (DOURADO) ========== -->
    <path d="M 118 128 
             L 154 128 
             L 154 123 
             L 118 123 
             Z" 
          fill="url(#goldGrad)" opacity="0.9"/>
    
  </g>
  
  <!-- ==================== TRAÇO DIVISÓRIO ARQUEADO ==================== -->
  <path d="M 62 142 Q 100 134 138 142" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- ==================== TEXTO "IMÓVEIS" ==================== -->
  <text x="100" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" 
        fill="#F2B21A" text-anchor="middle" letter-spacing="6" dominant-baseline="central"
        stroke="#C88700" stroke-width="0.3">
    IMÓVEIS
  </text>
</svg>
